name: Build and push Docker image

# Triggers:
#   - push to main           → build, and publish :latest / :<sha> when Docker Hub secrets exist
#   - tag matching v*.*.*    → build, and publish semver tags when Docker Hub secrets exist
#   - manual dispatch        → build, and publish :<sha> when Docker Hub secrets exist
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE_NAME: tl-finance-core
  DOCKERHUB_NAMESPACE: techlotse

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget_ci_password
          POSTGRES_DB: budget
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_SECRET: 0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://budget:budget_ci_password@localhost:5432/budget?schema=public
      EXCHANGE_RATE_PROVIDER: frankfurter
      FRANKFURTER_BASE_URL: https://api.frankfurter.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Public readiness checks
        run: npm run test:readiness

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Validate migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'

    env:
      DOCKERHUB_USERNAME: ${{ secrets.ORG_DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.ORG_DOCKERHUB_KEY }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker publish target
        id: publish
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ORG_DOCKERHUB_USER or ORG_DOCKERHUB_KEY is missing; building without publishing."
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ORG_DOCKERHUB_USER }}
          password: ${{ secrets.ORG_DOCKERHUB_KEY }}

      - name: Extract Docker metadata
        if: steps.publish.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.publish.outputs.image }}
          # Build a useful tag set for v1 release plus everyday CI:
          #   - branch builds  → :main / :latest
          #   - sha            → :<sha>
          #   - semver tags    → :v1.2.3, :1.2.3, :1.2, :1, :latest
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}

      - name: Build and push (linux/amd64 + linux/arm64)
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ARM64 lets the image boot on Apple Silicon dev machines + AWS
          # Graviton / Hetzner Ampere instances. AMD64 stays the default.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build without publishing (linux/amd64 + linux/arm64)
        if: steps.publish.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: local/${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
